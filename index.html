<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>DMJ HRIS — Enterprise Human Resource & Payroll System</title>

    <!-- Progressive Web App (PWA) Capabilities -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FF6B00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DMJ HRIS" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Preconnect Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet" />
    <script src="/models/face-api.js"></script>

    <!-- Service Worker Registration & Live OTA Auto-Update Detector -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              window.__PRIME_SW_REG__ = reg;
              console.log('[PWA] Service Worker aktif:', reg.scope);

              // 1. If a worker is already waiting in background, notify UI immediately
              if (reg.waiting) {
                console.log('[PWA] Versi baru sedang menunggu aktivasi.');
                window.dispatchEvent(new CustomEvent('pwa-update-available', { detail: { registration: reg } }));
              }

              // 2. Handle background updates detected while app is open
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] Versi baru terdeteksi dan siap digunakan.');
                      window.dispatchEvent(new CustomEvent('pwa-update-available', { detail: { registration: reg } }));
                    }
                  };
                }
              };
            })
            .catch((err) => console.warn('[PWA] Pendaftaran SW gagal:', err));

          // 3. Auto-check updates when user brings PWA back to foreground
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && window.__PRIME_SW_REG__) {
              window.__PRIME_SW_REG__.update().catch(() => {});
            }
          });

          // 4. Periodic background update check every 15 minutes
          setInterval(() => {
            if (window.__PRIME_SW_REG__) {
              window.__PRIME_SW_REG__.update().catch(() => {});
            }
          }, 15 * 60 * 1000);
        });

        // 5. Seamless reload when the new worker takes control
        let isRefreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!isRefreshing) {
            isRefreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </head>
  <body class="antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
